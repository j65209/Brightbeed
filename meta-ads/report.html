<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메타 광고 분석 리포트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📱%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0a0d14; --panel:#121826; --panel-2:#1a2233; --border:#26314a;
    --text:#e8ecf5; --muted:#8a96b0; --accent:#4f7cff;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --info:#22d3ee;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif; font-size:14px; -webkit-font-smoothing:antialiased }
  a { color:var(--accent); text-decoration:none }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 60px }

  /* Header */
  header.top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px }
  .brand-title { display:flex; align-items:center; gap:10px }
  .brand-title h1 { font-size:22px; font-weight:800; letter-spacing:-.5px }
  .brand-title .icon { font-size:24px }
  .meta-info { display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted) }
  .meta-info b { color:var(--text); font-weight:600 }
  .refresh-btn { background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:4px }
  .refresh-btn:hover { background:var(--border) }
  .refresh-btn:active { transform:scale(.97) }

  /* Status banner */
  .status-banner { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; display:none; align-items:center; gap:8px }
  .status-banner.warn { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.4); color:#fbbf24; display:flex }
  .status-banner.err { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.4); color:#f87171; display:flex }

  /* KPI cards */
  .kpi-section-title { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:700; margin:6px 0 8px }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:14px }
  .kpi-grid.hero { grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:18px }
  .kpi { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow) }
  .kpi.hero { padding:18px 20px; border-radius:12px }
  .kpi .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; font-weight:600 }
  .kpi.hero .label { font-size:12px }
  .kpi .value { font-size:22px; font-weight:800; letter-spacing:-.5px; color:var(--text) }
  .kpi.hero .value { font-size:30px }
  .kpi .sub { font-size:11px; color:var(--muted); margin-top:3px }
  .kpi.hero .sub { font-size:12px; margin-top:5px }
  .kpi.ok .value { color:var(--ok) }
  .kpi.warn .value { color:var(--warn) }
  .kpi.err .value { color:var(--err) }
  .kpi.emph { border-color:rgba(79,124,255,.4); background:linear-gradient(180deg, rgba(79,124,255,.08), var(--panel)) }
  .kpi.spend-today { border-color:rgba(34,211,238,.4); background:linear-gradient(180deg, rgba(34,211,238,.08), var(--panel)) }
  .kpi.spend-yesterday { border-color:rgba(139,145,158,.35); background:linear-gradient(180deg, rgba(139,145,158,.06), var(--panel)) }
  .kpi.budget-realtime { border-color:rgba(34,197,94,.4); background:linear-gradient(180deg, rgba(34,197,94,.08), var(--panel)) }

  /* Budget progress bar */
  .budget-bar { display:block; margin-top:8px; background:var(--panel-2); height:8px; border-radius:6px; overflow:hidden; position:relative }
  .budget-bar-fill { height:100%; border-radius:6px; transition:width .3s ease; background:linear-gradient(90deg, var(--ok), #06d6a0) }
  .budget-bar-fill.warn { background:linear-gradient(90deg, var(--warn), #fbbf24) }
  .budget-bar-fill.err { background:linear-gradient(90deg, var(--err), #f87171) }
  .mini-roas { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; font-weight:700 }
  .mini-roas.ok { background:rgba(34,197,94,.15); color:var(--ok) }
  .mini-roas.warn { background:rgba(245,158,11,.15); color:var(--warn) }
  .mini-roas.err { background:rgba(239,68,68,.15); color:var(--err) }

  /* KPI label description (한글 설명) */
  .kpi .label-ko { color:var(--muted); font-weight:500; font-size:10.5px; text-transform:none; letter-spacing:0; margin-left:5px }

  /* Period filter tabs */
  .period-tabs { display:inline-flex; gap:2px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:3px; margin-right:10px }
  .period-tabs button { background:transparent; color:var(--muted); border:0; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:all .12s }
  .period-tabs button:hover { color:var(--text); background:rgba(255,255,255,.04) }
  .period-tabs button.active { background:var(--accent); color:#fff }
  .period-tabs button:disabled { opacity:.35; cursor:not-allowed }

  /* Filter bar layout expanded */
  .filter-bar .right { display:flex; align-items:center; gap:12px; flex-wrap:wrap }
  .period-info { font-size:11px; color:var(--muted) }
  .period-info b { color:var(--text) }

  /* Filter bar */
  .filter-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap }
  .filter-bar .left { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted) }
  .toggle { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--border); border-radius:999px; background:var(--panel-2); cursor:pointer; font-size:12px; color:var(--text); user-select:none }
  .toggle input { appearance:none; width:32px; height:18px; background:var(--border); border-radius:999px; position:relative; cursor:pointer; transition:background .18s }
  .toggle input::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .18s }
  .toggle input:checked { background:var(--accent) }
  .toggle input:checked::after { transform:translateX(14px) }

  /* Status badge inside table */
  .status-badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:700; margin-left:6px; vertical-align:middle }
  .status-badge.active { background:rgba(34,197,94,.18); color:var(--ok) }
  .status-badge.paused { background:rgba(139,145,158,.18); color:var(--muted) }

  /* Ads tooltip (fixed positioning so it escapes table overflow) */
  .campaign-name-wrap { display:inline-block; max-width:100%; }
  .has-ads { cursor:help }
  .has-ads::after { content:'💬'; font-size:10px; margin-left:5px; opacity:.55 }
  #adsFloatingTip {
    display:none;
    position:fixed;
    z-index:9999;
    min-width:260px; max-width:420px;
    background:#0f1524; border:1px solid var(--accent);
    border-radius:8px; padding:10px 12px;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
    white-space:normal; color:var(--text); font-size:12px; line-height:1.5;
    pointer-events:none;
  }
  #adsFloatingTip .tip-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700; margin-bottom:6px; border-bottom:1px solid var(--border); padding-bottom:5px }
  #adsFloatingTip .tip-item { padding:3px 0; color:var(--text); font-weight:500 }
  #adsFloatingTip .tip-empty { color:var(--muted); font-style:italic }

  /* Sections */
  section { margin-bottom:28px }
  h2 { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px; color:var(--text) }
  h2 .count { color:var(--muted); font-weight:500; font-size:12px }

  /* Feedback cards */
  .feedback-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px }
  @media (max-width:800px) { .feedback-grid { grid-template-columns:1fr } }
  .fb-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:var(--shadow) }
  .fb-card h3 { font-size:13px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px; padding-bottom:8px; border-bottom:1px solid var(--border) }
  .fb-card.ok h3 { color:var(--ok) }
  .fb-card.err h3 { color:var(--err) }
  .fb-card.info h3 { color:var(--info) }
  .fb-card.action h3 { color:var(--accent) }
  .fb-item { padding:9px 0; border-bottom:1px dashed var(--border); font-size:13px; line-height:1.5 }
  .fb-item:last-child { border-bottom:none }
  .fb-item .name { font-weight:700; color:var(--text); margin-bottom:2px }
  .fb-item .reason { color:var(--muted); font-size:12px }
  .fb-item.action { padding:8px 0; color:var(--text) }
  .fb-item.insight { padding:7px 0; color:var(--text); font-size:12.5px }
  .fb-empty { color:var(--muted); font-style:italic; padding:8px 0; font-size:12.5px }

  /* Campaign table */
  .table-wrap { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:var(--shadow) }
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch }
  table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:800px }
  th, td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap }
  th { background:var(--panel-2); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; position:sticky; top:0; cursor:pointer; user-select:none }
  th:hover { color:var(--text) }
  th .arrow { opacity:.4; font-size:9px; margin-left:2px }
  th.sort-asc .arrow, th.sort-desc .arrow { opacity:1; color:var(--accent) }
  th.name-col, td.name-col { text-align:left; max-width:280px; overflow:hidden; text-overflow:ellipsis }
  td.num { font-variant-numeric:tabular-nums }
  tr:hover td { background:rgba(255,255,255,.03) }
  .roas-tag { display:inline-block; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:700 }
  .roas-tag.hi { background:rgba(34,197,94,.15); color:var(--ok) }
  .roas-tag.mid { background:rgba(245,158,11,.15); color:var(--warn) }
  .roas-tag.lo { background:rgba(239,68,68,.15); color:var(--err) }

  /* Loading / error */
  .center { text-align:center; padding:60px 20px; color:var(--muted) }
  .spinner { display:inline-block; width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite }
  @keyframes spin { to { transform:rotate(360deg) } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand-title">
      <span class="icon">📱</span>
      <h1 id="brandName">메타 광고 분석 리포트</h1>
    </div>
    <div class="meta-info">
      <span id="periodInfo"></span>
      <span id="generatedInfo"></span>
      <button class="refresh-btn" onclick="location.reload()">🔄 새로고침</button>
    </div>
  </header>

  <div id="statusBanner" class="status-banner"></div>

  <div id="content">
    <div class="center"><div class="spinner"></div><div style="margin-top:12px">데이터 로딩 중…</div></div>
  </div>
</div>
<div id="adsFloatingTip"></div>

<script>
  const params = new URLSearchParams(location.search);
  const brand = params.get('brand') || 'cleartype';
  const dataUrl = `../data/meta-ads/${brand}.json?cb=${Date.now()}`;
  const el = id => document.getElementById(id);

  const fmt = {
    // 사장님 요청: 모두 달러 표시
    money: (v) => '$' + (v||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
    moneyBig: (v) => '$' + (v||0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }),
    int: v => (v||0).toLocaleString('en-US'),
    pct: v => (v||0).toFixed(2) + '%',
    dec: (v,n=2) => (v||0).toFixed(n),
  };

  const roasClass = v => v>=2 ? 'hi' : v>=1 ? 'mid' : 'lo';
  const roasTag = v => `<span class="roas-tag ${roasClass(v)}">${fmt.dec(v)}</span>`;

  function fmtDate(iso){
    if(!iso) return '';
    try {
      const d = new Date(iso);
      const M = String(d.getMonth()+1).padStart(2,'0');
      const D = String(d.getDate()).padStart(2,'0');
      const h = String(d.getHours()).padStart(2,'0');
      const m = String(d.getMinutes()).padStart(2,'0');
      return `${d.getFullYear()}-${M}-${D} ${h}:${m}`;
    } catch { return iso }
  }

  // 전역: 필터 상태
  let showActiveOnly = true;
  let currentPeriod = null; // 기본은 data.default_preset 로 초기화
  let lastRenderedData = null;

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function render(data){
    lastRenderedData = data;
    const acct = data.account || {};
    const s = data.summary || {};
    const fb = data.feedback || {};
    const today = data.today || {};
    const yesterday = data.yesterday || {};
    const md = data.md_sales || {};
    const mdToday = md.today || {};
    const mdYst = md.yesterday || {};
    const currency = acct.currency || '';

    const activeCount = data.active_campaign_count ?? (data.campaigns||[]).filter(c => c.is_active).length;

    // MD 매출 서브텍스트 (실 매출 USD + KRW 병기, 실 ROAS, FB 픽셀 대비)
    const mdSub = (mdSlice, adSpend, fbRoas, fbRev) => {
      if (!mdSlice.usd) return `<span style="color:var(--muted)">MD 매출 데이터 없음</span>`;
      const realRoas = adSpend ? (mdSlice.usd / adSpend) : 0;
      const roasCls = realRoas>=2 ? 'ok' : realRoas>=1 ? 'warn' : 'err';
      const krw = '₩' + (mdSlice.krw||0).toLocaleString('en-US');
      return `<div style="display:flex;flex-direction:column;gap:2px">
        <div><b style="color:var(--text);font-size:13px">MD 매출 ${fmt.money(mdSlice.usd)}</b> <span style="color:var(--muted);font-size:11px">(${krw} · ${mdSlice.orders}건)</span></div>
        <div><span class="mini-roas ${roasCls}">실 ROAS ${fmt.dec(realRoas)}</span> <span style="color:var(--muted);font-size:11px;margin-left:8px">FB픽셀 ${fmt.money(fbRev)} · ROAS ${fmt.dec(fbRoas)}</span></div>
      </div>`;
    };

    el('brandName').textContent = `${data.brand_name || acct.name || brand} · 메타 광고 분석 리포트`;
    el('periodInfo').innerHTML = `📅 <b>${data.period?.label || '-'}</b> · ${data.period?.since || ''} ~ ${data.period?.until || ''}`;
    el('generatedInfo').innerHTML = `🕐 생성 ${fmtDate(data.generated_at)}`;

    // Status banner: 계정 상태 or 화폐 환기
    const bannerLines = [];
    if (acct.status_code && acct.status_code !== 1) {
      const cls = [101, 100, 2].includes(acct.status_code) ? 'err' : 'warn';
      const banner = el('statusBanner');
      banner.className = 'status-banner ' + cls;
      banner.innerHTML = `⚠ 계정 상태: <b>${acct.status_label}</b> (코드 ${acct.status_code}) — 결제 정보 점검 권장`;
    }

    const html = [];

    // === 오늘 지출 · 어제 지출 · 실시간 예산 (hero 3-column) ===
    const bs = data.budget_summary || {};
    const usedPct = Math.min(100, bs.used_pct || 0);
    const barCls = usedPct >= 90 ? 'err' : usedPct >= 70 ? 'warn' : '';
    const budgetTopCamp = (bs.campaigns || []).slice(0, 3).map(c =>
      `${escapeHtml(c.name)} $${(c.budget||0).toFixed(0)}`
    ).join(' · ');
    const budgetSub = bs.daily_budget_total > 0
      ? `<div style="display:flex;flex-direction:column;gap:3px">
          <div><b style="font-size:13px">${fmt.money(bs.remaining)}</b> <span style="color:var(--muted);font-size:11px">남음 · ${usedPct.toFixed(0)}% 소진</span></div>
          <div class="budget-bar"><div class="budget-bar-fill ${barCls}" style="width:${usedPct}%"></div></div>
          <div style="color:var(--muted);font-size:10.5px;margin-top:2px">${bs.active_campaign_count}개 캠페인${budgetTopCamp?` · ${budgetTopCamp}`:''}</div>
        </div>`
      : `<span style="color:var(--muted)">예산 데이터 없음</span>`;

    const mdSourceBadge = md.source_file ? `<span style="color:var(--muted);font-size:10px;margin-left:6px">MD · 환율 1$=₩${md.usd_krw_rate}</span>` : '';
    html.push(`<div class="kpi-section-title">🕐 실시간 지출 & 예산 ${mdSourceBadge}</div>`);
    html.push(`<div class="kpi-grid hero">
      <div class="kpi hero spend-today">
        <div class="label">오늘 지출 (KST)</div>
        <div class="value">${fmt.money(today.spend)}</div>
        <div class="sub">${mdSub(mdToday, today.spend, today.roas, today.purchase_value)}</div>
      </div>
      <div class="kpi hero spend-yesterday">
        <div class="label">어제 지출</div>
        <div class="value">${fmt.money(yesterday.spend)}</div>
        <div class="sub">${mdSub(mdYst, yesterday.spend, yesterday.roas, yesterday.purchase_value)}</div>
      </div>
      <div class="kpi hero budget-realtime">
        <div class="label">실시간 예산 (일 총합)</div>
        <div class="value">${fmt.money(bs.daily_budget_total || 0)}</div>
        <div class="sub">${budgetSub}</div>
      </div>
    </div>`);

    // === 핵심 지표: ROAS · CPA · 지출 (기간 요약, 우선순위 카드) ===
    html.push(`<div class="kpi-section-title">🎯 핵심 지표 · ${data.period?.label || ''}</div>`);
    html.push(`<div class="kpi-grid hero">
      <div class="kpi hero ${s.roas>=2?'ok':s.roas>=1?'warn':'err'}">
        <div class="label">ROAS</div>
        <div class="value">${fmt.dec(s.roas)}</div>
        <div class="sub">$1 지출당 매출 · 손익분기 1.0</div>
      </div>
      <div class="kpi hero emph">
        <div class="label">구매당 가격 (CPA)</div>
        <div class="value">${fmt.money(s.cpa)}</div>
        <div class="sub">구매 ${fmt.int(s.purchases)}건</div>
      </div>
      <div class="kpi hero emph">
        <div class="label">지출 (기간 총합)</div>
        <div class="value">${fmt.money(s.spend)}</div>
        <div class="sub">매출 ${fmt.money(s.purchase_value)} · ${activeCount}/${(data.campaigns||[]).length}개 집행중</div>
      </div>
    </div>`);

    // === 보조 지표 (한글 설명 병기) ===
    html.push(`<div class="kpi-section-title">📊 보조 지표</div>`);
    html.push(`<div class="kpi-grid">
      <div class="kpi">
        <div class="label">CTR <span class="label-ko">클릭률 · 노출→클릭</span></div>
        <div class="value">${fmt.pct(s.ctr)}</div>
        <div class="sub">${fmt.int(s.clicks)} 클릭 / ${fmt.int(s.impressions)} 노출</div>
      </div>
      <div class="kpi">
        <div class="label">CPC <span class="label-ko">클릭당 비용</span></div>
        <div class="value">${fmt.money(s.cpc)}</div>
        <div class="sub">한 번의 클릭에 드는 광고비</div>
      </div>
      <div class="kpi">
        <div class="label">CPM <span class="label-ko">노출당 비용 (1,000회)</span></div>
        <div class="value">${fmt.money(s.cpm)}</div>
        <div class="sub">1,000명에게 광고 보여주는 비용</div>
      </div>
      <div class="kpi">
        <div class="label">노출 <span class="label-ko">본 사람 수</span></div>
        <div class="value">${fmt.int(s.impressions)}</div>
        <div class="sub">클릭 ${fmt.int(s.clicks)}</div>
      </div>
    </div>`);

    // Feedback: Actions + Insights top row
    html.push(`<section style="margin-top:24px"><h2>💡 액션 & 인사이트</h2><div class="feedback-grid">
      <div class="fb-card action"><h3>📌 이번 주 액션 아이템</h3>
        ${(fb.actions && fb.actions.length) ? fb.actions.map(a=>`<div class="fb-item action">${a}</div>`).join('') : '<div class="fb-empty">특별한 액션 없음</div>'}
      </div>
      <div class="fb-card info"><h3>🔍 데이터 인사이트</h3>
        ${(fb.insights && fb.insights.length) ? fb.insights.map(i=>`<div class="fb-item insight">${i}</div>`).join('') : '<div class="fb-empty">인사이트 없음</div>'}
      </div>
    </div></section>`);

    // Feedback: Scale up + Reduce
    html.push(`<section><h2>🎯 캠페인 최적화 제안 <span class="count">· 집행중 캠페인 기준</span></h2><div class="feedback-grid">
      <div class="fb-card ok"><h3>🟢 예산 확대 후보 <span style="color:var(--muted);font-weight:400;font-size:11px">· ROAS ≥ 2.0</span></h3>
        ${(fb.scale_up && fb.scale_up.length) ? fb.scale_up.map(x=>`
          <div class="fb-item"><div class="name">${escapeHtml(x.name)}</div><div class="reason">${x.reason}</div></div>
        `).join('') : '<div class="fb-empty">기준 충족 캠페인 없음</div>'}
      </div>
      <div class="fb-card err"><h3>🔴 정리/재검토 후보 <span style="color:var(--muted);font-weight:400;font-size:11px">· ROAS ≤ 1.0</span></h3>
        ${(fb.reduce_or_kill && fb.reduce_or_kill.length) ? fb.reduce_or_kill.map(x=>`
          <div class="fb-item"><div class="name">${escapeHtml(x.name)}</div><div class="reason">${x.reason}</div></div>
        `).join('') : '<div class="fb-empty">저효율 캠페인 없음</div>'}
      </div>
    </div></section>`);

    // Filter bar + Full campaigns table
    if (!currentPeriod) currentPeriod = data.default_preset || 'last_7d';
    const periodOptions = data.period_options || [];
    const periodTabsHtml = periodOptions.length
      ? `<div class="period-tabs">${periodOptions.map(p =>
          `<button data-period="${p.key}" ${p.key===currentPeriod?'class="active"':''} ${!p.available?'disabled title="데이터 없음"':''}>${p.label}</button>`
        ).join('')}</div>`
      : '';

    html.push(`<section>
      <h2>📋 캠페인 상세 <span class="count" id="campCount"></span></h2>
      <div class="filter-bar">
        <div class="left">
          <span>💡 캠페인명 위에 마우스를 올리면 <b>집행중인 광고 목록</b>이 표시됩니다.</span>
        </div>
        <div class="right">
          ${periodTabsHtml}
          <label class="toggle" for="activeOnly">
            <input type="checkbox" id="activeOnly" ${showActiveOnly ? 'checked' : ''}>
            <span>집행중만</span>
          </label>
        </div>
      </div>
      <div class="period-info" id="periodInfoBar" style="margin-bottom:10px"></div>
      <div class="table-wrap"><div class="table-scroll"><table id="campTbl">
        <thead><tr>
          <th class="name-col" data-key="name">캠페인 <span class="arrow">↕</span></th>
          <th data-key="roas" class="sort-desc">ROAS <span class="arrow">▼</span></th>
          <th data-key="cpa">구매당 가격 <span class="arrow">↕</span></th>
          <th data-key="spend">지출 <span class="arrow">↕</span></th>
          <th data-key="purchase_value">매출 <span class="arrow">↕</span></th>
          <th data-key="purchases">구매 <span class="arrow">↕</span></th>
          <th data-key="ctr">CTR <span class="arrow">↕</span></th>
          <th data-key="cpc">CPC <span class="arrow">↕</span></th>
          <th data-key="clicks">클릭 <span class="arrow">↕</span></th>
          <th data-key="impressions">노출 <span class="arrow">↕</span></th>
        </tr></thead>
        <tbody id="campBody"></tbody>
      </table></div></div>
    </section>`);

    el('content').innerHTML = html.join('');

    // 초기 정렬: ROAS 내림차순 (핵심 지표 우선 노출)
    renderTable('roas', 'desc');
    setupSort();

    // 필터 토글
    const toggle = el('activeOnly');
    if (toggle) toggle.addEventListener('change', e => {
      showActiveOnly = e.target.checked;
      renderTable(currentSortKey, currentSortDir);
    });

    // 기간 탭
    document.querySelectorAll('.period-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        currentPeriod = btn.dataset.period;
        document.querySelectorAll('.period-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTable(currentSortKey, currentSortDir);
      });
    });
  }

  let currentSortKey = 'roas', currentSortDir = 'desc';

  function renderTable(sortKey, dir){
    currentSortKey = sortKey; currentSortDir = dir;
    if (!lastRenderedData) return;

    // 선택된 기간 데이터 우선. 없으면 기본 campaigns fallback.
    const periodCampaigns = lastRenderedData.campaigns_by_period || {};
    const periodMeta = lastRenderedData.period_meta || {};
    const periodRows = (currentPeriod && periodCampaigns[currentPeriod]) || lastRenderedData.campaigns || [];
    let rows = [...periodRows];
    if (showActiveOnly) rows = rows.filter(r => r.is_active);

    rows.sort((a,b) => {
      const av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
      if (typeof av === 'string') return dir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return dir==='asc' ? av - bv : bv - av;
    });

    const totalAll = periodRows.length;
    const activeAll = periodRows.filter(r => r.is_active).length;
    const countEl = el('campCount');
    if (countEl) countEl.textContent = showActiveOnly
      ? `· 집행중 ${rows.length}/${activeAll}개 표시 (전체 ${totalAll}개)`
      : `· 전체 ${rows.length}개 (집행중 ${activeAll}개)`;

    // 기간 요약 정보 바
    const infoBar = el('periodInfoBar');
    if (infoBar) {
      const meta = periodMeta[currentPeriod];
      const psum = (lastRenderedData.summaries_by_period || {})[currentPeriod];
      if (meta && psum) {
        infoBar.innerHTML = `📅 <b>${meta.label}</b> (${meta.since} ~ ${meta.until}) · 지출 <b>${fmt.money(psum.spend)}</b> · 매출 <b>${fmt.money(psum.purchase_value)}</b> · ROAS <b>${fmt.dec(psum.roas)}</b> · 구매 ${fmt.int(psum.purchases)}건`;
      } else {
        infoBar.innerHTML = '';
      }
    }

    el('campBody').innerHTML = rows.map((r, idx) => {
      const activeAds = r.active_ads || [];
      const badge = r.is_active
        ? '<span class="status-badge active">집행중</span>'
        : `<span class="status-badge paused">${escapeHtml(r.effective_status || '중지')}</span>`;
      const nameCls = 'campaign-name-wrap' + (activeAds.length ? ' has-ads' : '');
      return `
      <tr>
        <td class="name-col">
          <span class="${nameCls}" data-camp-idx="${idx}" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}${badge}</span>
        </td>
        <td class="num">${roasTag(r.roas)}</td>
        <td class="num">${r.cpa ? fmt.money(r.cpa) : '—'}</td>
        <td class="num">${fmt.money(r.spend)}</td>
        <td class="num">${fmt.money(r.purchase_value)}</td>
        <td class="num">${fmt.int(r.purchases)}</td>
        <td class="num">${fmt.pct(r.ctr)}</td>
        <td class="num">${fmt.money(r.cpc)}</td>
        <td class="num">${fmt.int(r.clicks)}</td>
        <td class="num">${fmt.int(r.impressions)}</td>
      </tr>
    `; }).join('') || '<tr><td colspan="10" class="center" style="padding:32px;color:var(--muted)">표시할 캠페인이 없습니다.</td></tr>';

    attachHoverTips(rows);
  }

  function attachHoverTips(rows){
    const tip = document.getElementById('adsFloatingTip');
    if (!tip) return;
    document.querySelectorAll('.campaign-name-wrap').forEach(el => {
      el.addEventListener('mouseenter', ev => {
        const idx = parseInt(el.dataset.campIdx, 10);
        const r = rows[idx];
        if (!r) return;
        const ads = r.active_ads || [];
        if (!ads.length && !r.is_active) { tip.style.display = 'none'; return; }
        tip.innerHTML = ads.length
          ? `<div class="tip-title">🟢 집행중 광고 ${ads.length}개</div>` + ads.map(a=>`<div class="tip-item">• ${escapeHtml(a.name)}</div>`).join('')
          : `<div class="tip-title">집행중 광고</div><div class="tip-empty">활성 광고 없음</div>`;
        tip.style.display = 'block';
        positionTip(tip, el);
      });
      el.addEventListener('mousemove', ev => {
        if (tip.style.display === 'block') positionTip(tip, el);
      });
      el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  }

  function positionTip(tip, el){
    const r = el.getBoundingClientRect();
    const tipW = tip.offsetWidth || 320;
    const tipH = tip.offsetHeight || 100;
    let left = r.left;
    let top = r.bottom + 6;
    if (left + tipW > window.innerWidth - 10) left = window.innerWidth - tipW - 10;
    if (top + tipH > window.innerHeight - 10) top = r.top - tipH - 6;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }

  function setupSort(){
    document.querySelectorAll('#campTbl th').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        let dir;
        if (currentSortKey === key) dir = currentSortDir==='asc' ? 'desc' : 'asc';
        else dir = ['name'].includes(key) ? 'asc' : 'desc';
        document.querySelectorAll('#campTbl th').forEach(t => {
          t.classList.remove('sort-asc','sort-desc');
          const arrow = t.querySelector('.arrow');
          if (arrow) arrow.textContent = '↕';
        });
        th.classList.add('sort-'+dir);
        const arrow = th.querySelector('.arrow');
        if (arrow) arrow.textContent = dir==='asc' ? '▲' : '▼';
        renderTable(key, dir);
      });
    });
  }

  fetch(dataUrl, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('데이터 없음'); return r.json() })
    .then(render)
    .catch(err => {
      el('content').innerHTML = `<div class="center">
        <div style="font-size:36px;margin-bottom:12px">📭</div>
        <div style="font-size:15px;color:var(--text);margin-bottom:6px">아직 <b>${brand}</b> 브랜드 리포트가 준비되지 않았어요</div>
        <div style="font-size:12px;color:var(--muted)">${err.message}</div>
        <div style="margin-top:20px;font-size:12px;color:var(--muted)">
          서버에서 <code style="background:var(--panel);padding:2px 6px;border-radius:4px">python3 ~/projects/fb-ads/build_dashboard_report.py ${brand}</code> 실행 후 커밋/푸시하세요.
        </div>
      </div>`;
    });
</script>
</body>
</html>
