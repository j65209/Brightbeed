<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agents · Live Office</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f2ed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#f5f2ed;
    --bg-1:#ffffff;
    --bg-2:#ecebe6;
    --floor:#efeae0;
    --floor-2:#e6dfd0;
    --rug:#eae4d6;
    --rug-line:#d8ceba;
    --wood:#e0cba1;
    --wood-2:#c9b280;
    --wood-edge:#a89163;
    --alu:#e8ebee;
    --alu-2:#d1d5db;
    --screen-off:#0f172a;
    --screen-on:#111827;
    --key:#fafafa;
    --key-edge:#e5e7eb;
    --coffee-cup:#ffffff;
    --coffee:#8b6f47;
    --plant:#57895a;
    --plant-2:#6ca972;
    --pot:#d0b78a;
    --chair:#334155;
    --text-0:#0a0b0d;
    --text-1:#1f2329;
    --text-2:#3a3e46;
    --text-3:#6b6f77;
    --line:#e0d9c9;
    --line-2:#cabca0;
    --running:#10b981;
    --idle:#94a3b8;
    --warn:#f59e0b;
    --danger:#ef4444;
    --font:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-0);color:var(--text-0);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
  body{min-height:100vh;font-size:14px;line-height:1.5;font-weight:500;overflow-x:hidden}

  /* Header */
  .top{position:sticky;top:0;z-index:20;background:rgba(245,242,237,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.02em}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--running);box-shadow:0 0 0 3px rgba(16,185,129,.18);animation:pulse 2s ease-in-out infinite}
  .brand a{color:var(--text-3);font-weight:500;font-size:13px}
  .clock{margin-left:auto;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
  .clock .time{font-size:15px;font-weight:600;letter-spacing:0}
  .clock .date{font-size:12px;color:var(--text-3)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg-1);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2)}
  .pill .n{color:var(--running)}

  /* Legend */
  .legend{max-width:1240px;margin:0 auto;padding:12px 22px 0;display:flex;gap:10px;flex-wrap:wrap;color:var(--text-3);font-size:12px}
  .legend .item{display:inline-flex;align-items:center;gap:5px}
  .legend .dot{width:7px;height:7px;border-radius:50%}
  .legend .dot.r{background:var(--running);box-shadow:0 0 0 3px rgba(16,185,129,.16)}
  .legend .dot.i{background:var(--idle)}
  .legend .dot.s{background:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.16)}
  .legend .dot.w{background:var(--warn)}

  /* Office floor — 하늘에서 내려다 본 top-down 뷰 */
  .office{max-width:1240px;margin:0 auto;padding:22px 22px 60px;position:relative}
  .floor{position:relative;background:linear-gradient(180deg,var(--floor) 0%,var(--floor-2) 100%);border-radius:22px;padding:34px 24px 40px;border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(168,145,99,.06),0 20px 40px -30px rgba(0,0,0,.15)}
  .rug{position:absolute;inset:20px 40px;background:var(--rug);border-radius:14px;box-shadow:inset 0 0 0 1px var(--rug-line),inset 0 0 40px rgba(216,206,186,.4);z-index:0}
  .plant-corner{position:absolute;width:44px;height:44px;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.1))}

  /* Desks grid */
  .desks{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:44px 22px;padding:16px 8px}
  @media(max-width:720px){
    .desks{grid-template-columns:repeat(2,1fr);gap:32px 10px;padding:8px 4px}
    .floor{padding:20px 12px 28px;border-radius:16px}
    .rug{inset:12px 20px;border-radius:10px}
  }
  @media(max-width:420px){
    .desks{grid-template-columns:1fr}
  }

  /* Individual desk cell */
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
  .desk-svg{width:100%;max-width:240px;height:auto;aspect-ratio:200/205;filter:drop-shadow(0 10px 14px rgba(0,0,0,.08))}

  /* Speech bubble / status card */
  .bubble{width:100%;max-width:220px;background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:10px 12px 11px;box-shadow:0 8px 20px -14px rgba(0,0,0,.16),0 2px 5px -3px rgba(0,0,0,.05);transition:transform .2s ease,box-shadow .2s ease}
  .cell:hover .bubble{transform:translateY(-1px);box-shadow:0 14px 28px -14px rgba(0,0,0,.2),0 2px 6px -3px rgba(0,0,0,.08)}
  .bubble .row{display:flex;align-items:center;gap:6px}
  .bubble .name{font-size:12px;font-weight:700;letter-spacing:-.02em;color:var(--text-0)}
  .bubble .team{font-size:10px;font-weight:600;color:var(--text-3);padding:1px 6px;background:var(--bg-2);border-radius:999px;letter-spacing:-.01em}
  .bubble .task{font-size:12px;font-weight:500;color:var(--text-1);margin-top:5px;line-height:1.35;min-height:1.35em;word-break:keep-all}
  .bubble .meta{font-size:10.5px;color:var(--text-3);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:0}
  .bubble .meta b{color:var(--text-1);font-weight:600}
  .stat{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:-.01em;margin-left:auto}
  .stat .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .stat.running{color:#065f46;background:#d1fae5}
  .stat.running .dot{background:var(--running);animation:pulse 1.2s ease-in-out infinite}
  .stat.idle{color:#475569;background:#e2e8f0}
  .stat.idle .dot{background:var(--idle)}
  .stat.stale{color:#991b1b;background:#fee2e2}
  .stat.stale .dot{background:var(--danger);animation:pulse 1.8s ease-in-out infinite}
  .stat.warn{color:#92400e;background:#fef3c7}
  .stat.warn .dot{background:var(--warn)}

  /* Animated pieces on desk SVG */
  .cell.running .desk-svg .screen{fill:var(--screen-on);animation:screen-pulse 2s ease-in-out infinite}
  .cell.running .desk-svg .arm-l{animation:type-l 1.6s ease-in-out infinite}
  .cell.running .desk-svg .arm-r{animation:type-r 1.6s ease-in-out infinite .3s}
  .cell.stale .desk-svg{animation:shake 3.5s ease-in-out infinite}
  .cell.stale .desk-svg .screen{fill:#7f1d1d}
  .cell.running .bubble{border-color:rgba(16,185,129,.28)}
  .cell.stale .bubble{border-color:rgba(239,68,68,.24)}

  /* Foot */
  .foot{max-width:1240px;margin:0 auto;padding:0 22px 26px;color:var(--text-3);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}
  .foot .refresh{cursor:pointer;user-select:none}
  .foot .refresh:hover{color:var(--text-1)}

  /* Loading */
  .loading{position:fixed;inset:0;background:var(--bg-0);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .3s ease}
  .loading.hide{opacity:0;pointer-events:none}
  .loading .spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--text-2);border-radius:50%;animation:spin .8s linear infinite}

  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.25)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes screen-pulse{0%,100%{opacity:1}50%{opacity:.86}}
  @keyframes type-l{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-1px) rotate(-2deg)}}
  @keyframes type-r{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-1px) rotate(2deg)}}
  @keyframes shake{0%,90%,100%{transform:translateX(0)}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}96%{transform:translateX(-1px)}}
</style>
</head>
<body>

<div class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Bead Universe · Agents Office</span>
      <a href="./">← 대시보드</a>
    </div>
    <div class="clock">
      <span class="pill"><span class="n" id="running-n">–</span>명 근무 중 / <span id="total-n">–</span>명</span>
      <div style="text-align:right">
        <div class="time" id="clock-time">--:--:--</div>
        <div class="date" id="clock-date">----년 --월 --일</div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="item"><span class="dot r"></span>실행 중</span>
    <span class="item"><span class="dot i"></span>대기</span>
    <span class="item"><span class="dot w"></span>임박</span>
    <span class="item"><span class="dot s"></span>멈춤 · 확인 필요</span>
    <span style="margin-left:auto;color:var(--text-3)">🕊️ 하늘에서 내려다 본 사무실 · 15초마다 갱신</span>
  </div>
</div>

<div class="office">
  <div class="floor">
    <div class="rug"></div>
    <!-- Plants in corners -->
    <svg class="plant-corner" style="left:6px;top:6px" viewBox="0 0 44 44"><circle cx="22" cy="20" r="14" fill="#57895a"/><circle cx="15" cy="16" r="7" fill="#6ca972"/><circle cx="29" cy="16" r="7" fill="#6ca972"/><circle cx="22" cy="12" r="7" fill="#7ab882"/><circle cx="22" cy="34" r="6" fill="#d0b78a"/></svg>
    <svg class="plant-corner" style="right:6px;top:6px" viewBox="0 0 44 44"><circle cx="22" cy="20" r="14" fill="#57895a"/><circle cx="15" cy="16" r="7" fill="#6ca972"/><circle cx="29" cy="16" r="7" fill="#6ca972"/><circle cx="22" cy="12" r="7" fill="#7ab882"/><circle cx="22" cy="34" r="6" fill="#d0b78a"/></svg>
    <svg class="plant-corner" style="left:6px;bottom:6px" viewBox="0 0 44 44"><circle cx="22" cy="20" r="14" fill="#57895a"/><circle cx="15" cy="16" r="7" fill="#6ca972"/><circle cx="29" cy="16" r="7" fill="#6ca972"/><circle cx="22" cy="12" r="7" fill="#7ab882"/><circle cx="22" cy="34" r="6" fill="#d0b78a"/></svg>
    <svg class="plant-corner" style="right:6px;bottom:6px" viewBox="0 0 44 44"><circle cx="22" cy="20" r="14" fill="#57895a"/><circle cx="15" cy="16" r="7" fill="#6ca972"/><circle cx="29" cy="16" r="7" fill="#6ca972"/><circle cx="22" cy="12" r="7" fill="#7ab882"/><circle cx="22" cy="34" r="6" fill="#d0b78a"/></svg>

    <div class="desks" id="desks"></div>
  </div>
</div>

<div class="foot">
  <span>실시간 소스: <code>/agents/status</code> (프록시 · 로그 mtime + 스케줄)</span>
  <span class="refresh" id="refresh-btn">↻ 지금 갱신</span>
  <span id="last-fetch"></span>
</div>

<div class="loading" id="loading"><div class="spin"></div></div>

<script>
/* -------- Agent definitions (지금 24시간 도는 launchd 자동화 8개) --------
 * id: matches proxy /agents/status
 * team/hairColor/skin/cloth: appearance
 */
const AGENTS = [
  {id:"kd-brightbeed", name:"콜리",  team:"물류팀", hairColor:"#2c1810", skin:"#f4d5b3", cloth:"#7c3aed",
   taskLabel:"콰이디에어 배송 pull (BB)",   scheduleLabel:"매 10분", intervalSec:600},
  {id:"kd-shinebeed",  name:"밀리",  team:"물류팀", hairColor:"#3d2817", skin:"#f8dcbc", cloth:"#be185d",
   taskLabel:"콰이디에어 배송 pull (SB)",   scheduleLabel:"매 10분", intervalSec:600},
  {id:"vendor-fetch",  name:"노아",  team:"벤더",   hairColor:"#1a1a1a", skin:"#efc9a3", cloth:"#4f46e5",
   taskLabel:"벤더 마진 · gcCal 갱신",      scheduleLabel:"매 10분", intervalSec:600},
  {id:"pro-sales",     name:"자스민",team:"마케팅", hairColor:"#2c1810", skin:"#f6d0aa", cloth:"#65a30d",
   taskLabel:"식스샵Pro 매출 스냅",         scheduleLabel:"매 30분", intervalSec:1800},
  {id:"admin-sales",   name:"로건",  team:"마케팅", hairColor:"#5a3820", skin:"#f4d5b3", cloth:"#84cc16",
   taskLabel:"admin식스샵 매출 스냅",       scheduleLabel:"매 30분", intervalSec:1800},
  {id:"fb-ads",        name:"오스카",team:"광고팀", hairColor:"#1e1a17", skin:"#e8b98b", cloth:"#ea580c",
   taskLabel:"메타 광고 성과 갱신",         scheduleLabel:"매 30분", intervalSec:1800},
  {id:"daily-pptx",    name:"릴리",  team:"인사팀", hairColor:"#6b4423", skin:"#fadcbc", cloth:"#ff5f7a",
   taskLabel:"일일 매출 PPT 업로드",        scheduleLabel:"매일 08:00", cronH:8, cronM:0},
  {id:"brand-report",  name:"아이비",team:"기획팀", hairColor:"#2c1810", skin:"#f6d0aa", cloth:"#e11d48",
   taskLabel:"브랜드 분석리포트",           scheduleLabel:"수동 트리거", manual:true},
];

const $ = id => document.getElementById(id);
let statusMap = {};

function pad(n){ return String(n).padStart(2,"0"); }
function fmtTime(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtDate(d){ const w=["일","월","화","수","목","금","토"][d.getDay()]; return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${w})`; }
function fmtRel(sec){
  if(sec == null) return "–";
  const abs = Math.abs(sec);
  if(abs < 60) return `${Math.floor(abs)}초`;
  if(abs < 3600) return `${Math.floor(abs/60)}분`;
  if(abs < 86400) return `${Math.floor(abs/3600)}시간 ${Math.floor((abs%3600)/60)}분`;
  return `${Math.floor(abs/86400)}일`;
}
function nextRunFromAgent(a, now){
  if(a.manual) return null;
  const s = statusMap[a.id] || {};
  const nowMs = now.getTime();
  if(s.next_run) return s.next_run * 1000;
  if(a.intervalSec){
    const last = s.last_run ? s.last_run * 1000 : nowMs - a.intervalSec*500;
    return last + a.intervalSec*1000;
  }
  if(a.cronH != null){
    const t = new Date(now); t.setHours(a.cronH, a.cronM||0, 0, 0);
    if(t.getTime() < nowMs) t.setDate(t.getDate()+1);
    return t.getTime();
  }
  return null;
}
function deriveStatus(a, now){
  const s = statusMap[a.id];
  if(s && s.status) return s.status;
  if(a.manual) return "idle";
  const next = nextRunFromAgent(a, now);
  if(next && next - now.getTime() < 60*1000) return "warn";
  return "idle";
}

/* Top-down desk SVG — 하늘에서 내려다 본 캐릭터 + 애플 스타일 데스크셋업 */
function deskSvg(a){
  const {cloth, skin, hairColor} = a;
  return `
    <svg class="desk-svg" viewBox="0 0 200 205" xmlns="http://www.w3.org/2000/svg">
      <!-- 바닥 그림자 -->
      <ellipse cx="100" cy="200" rx="96" ry="4" fill="rgba(0,0,0,.06)"/>

      <!-- 책상 상판 (밝은 라이트 우드) -->
      <rect x="6" y="6" width="188" height="118" rx="10" fill="var(--wood)" stroke="var(--wood-edge)" stroke-width=".8"/>
      <!-- 나무결 힌트 -->
      <path d="M6,20 Q100,22 194,20" stroke="var(--wood-2)" stroke-width=".6" fill="none" opacity=".55"/>
      <path d="M6,52 Q100,54 194,52" stroke="var(--wood-2)" stroke-width=".5" fill="none" opacity=".45"/>
      <path d="M6,92 Q100,94 194,92" stroke="var(--wood-2)" stroke-width=".5" fill="none" opacity=".4"/>

      <!-- iMac 알루미늄 프레임 (top-down 얇게) -->
      <rect x="52" y="15" width="96" height="50" rx="4" fill="var(--alu)" stroke="rgba(0,0,0,.14)" stroke-width=".8"/>
      <!-- 스크린 -->
      <rect class="screen" x="55" y="18" width="90" height="44" rx="2" fill="var(--screen-off)"/>
      <!-- 스크린 반사광 -->
      <rect x="55" y="18" width="90" height="14" rx="2" fill="url(#screenLight-${a.id})" opacity=".18"/>
      <defs>
        <linearGradient id="screenLight-${a.id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- 스탠드 슬롯 힌트 (스크린 뒷쪽) -->
      <rect x="90" y="65" width="20" height="3" rx="1" fill="rgba(0,0,0,.14)"/>

      <!-- 매직 키보드 (화이트) -->
      <rect x="62" y="80" width="76" height="14" rx="2.5" fill="var(--key)" stroke="var(--key-edge)" stroke-width=".7"/>
      <line x1="66" y1="85" x2="134" y2="85" stroke="rgba(0,0,0,.05)" stroke-width=".5"/>
      <line x1="66" y1="89" x2="134" y2="89" stroke="rgba(0,0,0,.05)" stroke-width=".5"/>

      <!-- 매직 마우스 -->
      <ellipse cx="152" cy="87" rx="6" ry="8.5" fill="var(--key)" stroke="var(--key-edge)" stroke-width=".7"/>

      <!-- 커피컵 (top-down) -->
      <circle cx="26" cy="86" r="9" fill="var(--coffee-cup)" stroke="rgba(0,0,0,.15)" stroke-width=".7"/>
      <circle cx="26" cy="86" r="6" fill="var(--coffee)"/>
      <ellipse cx="24" cy="83" rx="2.2" ry="1" fill="rgba(255,255,255,.3)"/>

      <!-- 작은 화분 (책상 뒷쪽 오른편) -->
      <circle cx="170" cy="30" r="8" fill="var(--plant)"/>
      <circle cx="166" cy="26" r="4" fill="var(--plant-2)"/>
      <circle cx="174" cy="26" r="4" fill="var(--plant-2)"/>
      <circle cx="170" cy="24" r="4" fill="#7dc389"/>
      <ellipse cx="170" cy="40" rx="6" ry="2" fill="var(--pot)"/>

      <!-- 노트 (책상 왼편 하단) -->
      <rect x="16" y="102" width="22" height="14" rx="1.5" fill="#fefdf8" stroke="rgba(0,0,0,.1)" stroke-width=".6"/>
      <line x1="20" y1="107" x2="34" y2="107" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>
      <line x1="20" y1="111" x2="30" y2="111" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>

      <!-- 캐릭터 팔 (몸통에서 앞으로 뻗어 키보드 위, 세로 형태) -->
      <path class="arm-l" d="M84,132 Q83,115 86,96 L96,95 Q97,116 94,132 Z" fill="${cloth}"/>
      <path class="arm-r" d="M116,132 Q117,115 122,96 L134,96 Q136,110 143,100 Q146,96 150,96 L150,102 Q145,110 138,113 L128,113 Q125,124 124,132 Z" fill="${cloth}"/>
      <!-- 손 -->
      <ellipse cx="91" cy="91" rx="5.5" ry="4.5" fill="${skin}"/>
      <ellipse cx="150" cy="94" rx="4.5" ry="5" fill="${skin}"/>

      <!-- 캐릭터 어깨 (책상 앞 edge 밖으로 살짝만) -->
      <path d="M78,138 Q82,132 100,131 Q118,132 122,138 L124,156 Q100,160 76,156 Z" fill="${cloth}"/>
      <!-- 어깨 하이라이트 -->
      <path d="M84,134 Q100,132 116,134" stroke="rgba(255,255,255,.18)" stroke-width=".8" fill="none"/>

      <!-- 목 -->
      <ellipse cx="100" cy="139" rx="6" ry="3" fill="${skin}"/>

      <!-- 정수리 (헤어, top-down) -->
      <ellipse cx="100" cy="152" rx="16" ry="14" fill="${hairColor}"/>
      <!-- 귀 힌트 -->
      <ellipse cx="84" cy="152" rx="2" ry="3" fill="${skin}"/>
      <ellipse cx="116" cy="152" rx="2" ry="3" fill="${skin}"/>
      <!-- 헤어 하이라이트 -->
      <ellipse cx="94" cy="148" rx="3.5" ry="2.5" fill="rgba(255,255,255,.14)"/>
      <ellipse cx="106" cy="150" rx="1.6" ry="1.2" fill="rgba(255,255,255,.08)"/>

      <!-- 의자 등받이 (캐릭터 뒤편, 살짝만) -->
      <path d="M78,172 Q100,176 122,172 L122,190 Q100,194 78,190 Z" fill="var(--chair)" opacity=".82"/>
      <ellipse cx="100" cy="174" rx="22" ry="2" fill="rgba(0,0,0,.12)"/>
    </svg>
  `;
}

function renderDesks(){
  const wrap = $("desks");
  wrap.innerHTML = "";
  AGENTS.forEach(a => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.id = a.id;
    cell.innerHTML = `
      <div class="bubble">
        <div class="row">
          <span class="name">${a.name}</span>
          <span class="team">${a.team}</span>
          <span class="stat" data-stat><span class="dot"></span><span data-stat-label>–</span></span>
        </div>
        <div class="task" data-task>${a.taskLabel}</div>
        <div class="meta" data-meta>–</div>
      </div>
      ${deskSvg(a)}
    `;
    wrap.appendChild(cell);
  });
}

function updateCells(){
  const now = new Date();
  let running = 0;
  AGENTS.forEach(a=>{
    const cell = document.querySelector(`.cell[data-id="${a.id}"]`);
    if(!cell) return;
    const status = deriveStatus(a, now);
    cell.classList.remove("running","idle","stale","warn");
    cell.classList.add(status);
    const s = statusMap[a.id] || {};

    const statEl = cell.querySelector(".stat");
    statEl.className = "stat " + status;
    const labels = {running:"실행 중", idle:"대기", stale:"멈춤 · 확인", warn:"곧 실행"};
    statEl.querySelector("[data-stat-label]").textContent = labels[status] || status;

    const taskEl = cell.querySelector("[data-task]");
    if(status === "running") taskEl.textContent = (s.task || a.taskLabel) + " · 진행 중…";
    else if(status === "stale") taskEl.textContent = "예상 시각 초과 · " + (s.task || a.taskLabel);
    else taskEl.textContent = s.task || a.taskLabel;

    const metaEl = cell.querySelector("[data-meta]");
    let meta = "";
    if(s.last_run){
      const ago = (now.getTime()/1000) - s.last_run;
      meta += `마지막 <b>${fmtRel(ago)} 전</b>`;
    } else {
      meta += `마지막 <b>–</b>`;
    }
    const next = nextRunFromAgent(a, now);
    if(next && !a.manual){
      const inSec = (next - now.getTime())/1000;
      if(inSec > 0) meta += ` · 다음 <b>${fmtRel(inSec)} 후</b>`;
      else meta += ` · 다음 <b>임박</b>`;
    } else if(a.manual){
      meta += ` · ${a.scheduleLabel}`;
    }
    metaEl.innerHTML = meta;

    if(status === "running") running++;
  });
  $("running-n").textContent = running;
  $("total-n").textContent = AGENTS.length;
}

function updateClock(){
  const now = new Date();
  $("clock-time").textContent = fmtTime(now);
  $("clock-date").textContent = fmtDate(now);
}

async function fetchStatus(){
  try{
    // proxy tunnel URL 은 index.html 에도 있는 GitHub raw 를 재사용
    const TUNNEL_URL = 'https://raw.githubusercontent.com/j65209/Brightbeed/main/tunnel.json';
    const pin = localStorage.getItem('bb_pin') || localStorage.getItem('brightbeed.pin') || '';
    // 우선 localStorage cache
    let base = window._proxyBase;
    if(!base){
      try{
        const r0 = await fetch(TUNNEL_URL + '?cb=' + Date.now(), {cache:'no-cache'});
        if(r0.ok){
          const j0 = await r0.json();
          base = (j0 && j0.url) ? j0.url.replace(/\/$/,'') : null;
          window._proxyBase = base;
        }
      }catch(e){}
    }
    if(!base || !pin){
      $("last-fetch").textContent = '· 스케줄 미러 (프록시/PIN 미연결)';
      return;
    }
    const r = await fetch(base + "/agents/status", {
      headers: {"X-Brightbeed-PIN": pin, "Accept":"application/json"},
      cache: "no-store",
    });
    if(r.ok){
      const j = await r.json();
      statusMap = {};
      (j.agents||[]).forEach(a => statusMap[a.id] = a);
      $("last-fetch").textContent = `· 갱신 ${fmtTime(new Date())}`;
      return;
    }
    $("last-fetch").textContent = `· HTTP ${r.status}`;
  }catch(e){
    $("last-fetch").textContent = `· 오류: ${e.message}`;
  }
}

function init(){
  renderDesks();
  updateClock();
  fetchStatus().then(()=>{
    updateCells();
    $("loading").classList.add("hide");
  });
  setInterval(updateClock, 1000);
  setInterval(updateCells, 1000);
  setInterval(fetchStatus, 15000);
  $("refresh-btn").addEventListener("click", ()=>{
    fetchStatus().then(updateCells);
  });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
